[package]
name = "wrn-kernel-core"
version = "0.2.0"
edition = "2021"
authors = ["Frank Van Laarhoven <frank@openmeta.io>"]
description = "Military-grade high-assurance RFC 9421 cryptographic kernel and bounded compartment engine for WRN"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }

[[bin]]
name = "wrn-kernel-daemon"
path = "src/main.rs"

[lib]
name = "wrn_kernel_core"
path = "src/lib.rs"
